[project]
name = "killclip"
version = "0.1.0"
description = "Find your kills in raw console gameplay recordings and cut clips, vertical clips, EDLs and beat-synced montages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.9"]
keywords = ["gaming", "montage", "kill-feed", "ffmpeg", "video"]

[project.scripts]
killclip = "killclip.cli:main"

[project.urls]
Homepage = "https://github.com/sunysaurav/killclip"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["killclip"]
